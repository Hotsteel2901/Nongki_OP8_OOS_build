name: Build Oneplus 8 (OxygenOS 13.1 A13) (ReSukiSU+SUSFS Kernel)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8"
  DEVICE_CODENAME : "instantnoodle"

  BRAND_SHOW_FLAG : "oneplus"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-android-"
  # OOS 4.19.157 旧代码 + clang 19: 禁用新 clang 默认 -Werror 严格警告
  # KCFLAGS 值必须用引号包裹(含空格), 否则 make 只取第一个参数
  EXTRA_CMDS : 'KCFLAGS="-Wno-strict-prototypes -Wno-incompatible-function-pointer-types -Wno-deprecated-non-prototype -Wno-implicit-int -Wno-int-to-pointer-cast -Wno-pointer-to-int-cast -Wno-implicit-function-declaration -Wno-unused-but-set-variable"'

  # OOS 官方内核 (OnePlus OSS, 4.19.157) - 设备树在独立仓库
  KERNEL_SOURCE : "https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "oneplus/sm8250_t_13.1_op8"

  # OOS 官方 vendor/devicetree 仓库 (含 oplus 内核模块 + kona DTS + 19821 设备树
  # + kernel/msm-4.19/techpack 的 camera/display/video 源码)
  # symlink 指向 vendor/, 需按 OnePlus 官方目录布局放置
  VENDOR_SOURCE : "https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250.git"
  VENDOR_BRANCH : "oneplus/sm8250_t_13.1_op8"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_ENABLE : true

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 保持 latest: 每次构建都会通过 ReSukiSU setup.sh (git pull) 拉取最新 main 分支
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oos13.1_a13"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  # DroidSpaces 配置已通过 defconfig_oos.patch 注入, 无需 build-process 再 merge droidspaces.config
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  # OOS 设备树直接编译 (非overlay), 通过 OnePlus 官方 Makefile 生成
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  # devicetree-4.19/19821/Makefile's non-overlay branch has an upstream OnePlus typo
  # (dtb-$(CONFIG_ARCH_LITO) instead of CONFIG_ARCH_KONA), so on a Kona defconfig it
  # silently builds nothing for 19821 (the real OnePlus 8 profile). CONFIG_BUILD_ARM64_DT_OVERLAY=y
  # (set in defconfig_oos.patch) switches 19821 to its overlay branch instead, which uses
  # CONFIG_ARCH_KONA correctly — matching luk1337 and LineageOS's own kona-perf_defconfig.
  # HAVE_NO_DTBO hooks mkdtimg into the kernel's own Makefile so `make` builds dtbo.img
  # natively as part of the default target; Pack Process already picks up dtbo.img if present.
  HAVE_NO_DTBO: "true"
  HAVE_NO_DTBO_TOOL: "false"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  # OOS defconfig 已内嵌 oplus 配置, 无需额外 merge oplus.config
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 (OxygenOS 13.1 A13) (ReSukiSU+SUSFS Kernel)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🏗️ Setup OOS vendor/devicetree layout
        run: |
          # OnePlus OOS 内核的 vendor symlink 指向 ../../../../../../vendor
          # (从 arch/arm64/boot/dts 上溯 6 层), 需把 devicetree+oplus 源码放到对应位置
          # 布局: <ROOT>/kernel_src/arch/arm64/boot/dts -> 6层 -> <ROOT>/vendor
          # 本 workflow 中 msm-4.19 位于 $GITHUB_WORKSPACE/kernel/msm-4.19
          # 其 6 层上级为 $GITHUB_WORKSPACE, 故 vendor 放在 $GITHUB_WORKSPACE/vendor
          cd $GITHUB_WORKSPACE
          if [ ! -d vendor ]; then
            echo "[-] vendor/ not found, devicetree missing."
            false
          fi
          # 验证关键 symlink 可解析 (devicetree + oplus kernel)
          cd kernel/msm-4.19
          for check in arch/arm64/boot/dts/vendor drivers/soc/oplus/system drivers/power/oplus fs/erofs; do
            if [ -e "$check" ]; then
              echo "[+] $check -> $(readlink -f $check)"
            else
              echo "[-] $check cannot resolve, OOS build will fail."
              false
            fi
          done
          echo "[+] OOS vendor/devicetree layout ready."

      - name: 🔧 Fix OOS vendor include paths & missing devicetree
        run: |
          # OnePlus 官方 modules_and_devicetree 仓库里的 oplus charger 驱动用
          # 4 层相对路径 include 内核头文件, 但按本 workflow 的目录布局
          # (vendor 在 $GITHUB_WORKSPACE/vendor, 内核在 $GITHUB_WORKSPACE/kernel/msm-4.19)
          # 从 charger_ic/ 到 kernel/msm-4.19/... 实际需要 5 层。
          # 4 层会解析到 $GITHUB_WORKSPACE/vendor/kernel/msm-4.19 (不存在),
          # 导致 oplus_battery_msm8250.c (OP8 实际编译的 charger 驱动) 编译失败。
          # 详细推导见 Bin/fix_oos_vendor.py 的 docstring。
          cd $GITHUB_WORKSPACE/vendor
          python3 /tmp/Bin/fix_oos_vendor.py

          # 19066 的 camera DTS 缺 kona-camera-sensor-rb5.dtsi, 但 19066/Makefile
          # 会 include 它 -> dtc 直接失败。OnePlus 自己在别的机型目录里带了同一份
          # 文件, 这里从 20801 复制补齐 (两份内容 byte-identical)。
          SRC="$GITHUB_WORKSPACE/vendor/qcom/proprietary/devicetree-4.19/20801/camera/kona-camera-sensor-rb5.dtsi"
          DST="$GITHUB_WORKSPACE/vendor/qcom/proprietary/devicetree-4.19/19066/camera/kona-camera-sensor-rb5.dtsi"
          if [ -f "$DST" ]; then
            echo "[+] 19066 kona-camera-sensor-rb5.dtsi already present."
          elif [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            echo "[+] 19066 kona-camera-sensor-rb5.dtsi filled from 20801."
          else
            echo "[-] Neither source nor destination exists, 19066 dtb build will fail."
            false
          fi
          echo "[+] OOS vendor fixes applied."

      - name: 🔧 Fix OPLUS_FEATURE_* gates (export for kbuild sub-makes)
        run: |
          # oplus_native_features.mk 用普通赋值 (=) 设置 ~230 个 OPLUS_FEATURE_*,
          # 但普通赋值不会进入环境, kbuild 递归到子目录时那些变量全是空,
          # 于是子 Makefile 里的 $(OPLUS_FEATURE_*) 门控恒为假、被它们守护的
          # 目标文件被静默丢弃。OplusKernelEnvConfig.mk 只为「编译器宏」做了
          # 补偿 (-D...), 对 Makefile 里的 $(...) 门控无能为力。
          #
          # OP8 (kona-perf) 上会直接导致 vmlinux 链接失败:
          #   drivers/scsi/ufs/  UFSPLUS 未导出 -> ufsfeature.o 不编译
          #                      -> ufsf_* / recordUniproErr 等 ~20 个符号未定义
          #   mm/                PROCESS_RECLAIM / MEMLEAK_DETECT 未导出
          #                      -> process_mm_reclaim.o 与 mm/task_mem/ 不编译
          #                      -> is_reclaim_should_cancel (vmscan.c:1231)
          #                         与 update_user_tasklist (fork.c:2326) 未定义
          #   net/, techpack/    -> oplus_router_boost/ 与 oplus_adfr.o 不编译
          # 注意调用方都在编译 (它们的 CONFIG_* 前置条件均为 =y), 只有定义方被丢弃,
          # 所以必须靠链接期报错才发现, 属于最隐蔽的一类构建缺陷。
          # 推导详见 Bin/fix_oplus_feature_gates.py 的 docstring。
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          python3 /tmp/Bin/fix_oplus_feature_gates.py

          # ReSukiSU 的 Kconfig/Makefile 注册点。
          # 注意 build-ready 的 manual 分支里 sed 目标写的是改名前的
          # ${GITHUB_WORKSPACE}/device_kernel/drivers/Kconfig, 该路径已不存在,
          # 那条分支实际会静默失败。本仓库 KERNELSU_METHOD=shell 走 ReSukiSU
          # setup.sh, 但为不让门控依赖上游脚本行为, 这里做一次幂等兜底。
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "[+] drivers/Kconfig: kernelsu Kconfig registered."
          else
            echo "[+] drivers/Kconfig: kernelsu Kconfig already registered."
          fi
          if ! grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
            echo "[+] drivers/Makefile: kernelsu registered."
          else
            echo "[+] drivers/Makefile: kernelsu already registered."
          fi
          echo "[+] OPLUS_FEATURE_* gates exported."

      - name: 📌 Kernel version suffix (OOS)
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          # ReSukiSU setup.sh 已注册 drivers/kernelsu (Makefile+Kconfig)
          # 这里仅设置自定义版本后缀
          echo "-g$(git rev-parse --short HEAD)-oos-hotsteel" > .scmversion
          echo "[+] .scmversion written."

      - name: 🪝 Patch Kernel of SUSFS + ReSukiSU (OOS)
        if: env.SUSFS_ENABLE == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/
          cp /tmp/Patches/Patch/susfs_resukisu_oos_4.19.patch ./
          # 不能用 `|| true`: 静默吞掉失败会让内核带着半套 SUSFS 继续编译,
          # 最终以 vmlinux undefined reference 或运行期异常的形式暴露, 极难定位。
          # 补丁必须干净应用, 否则立刻失败。
          patch -p1 --no-backup-if-mismatch < susfs_resukisu_oos_4.19.patch
          if find . -name '*.rej' -o -name '*.orig' | grep -q .; then
            echo "[-] Patch left .rej/.orig files:"
            find . -name '*.rej' -o -name '*.orig'
            false
          fi
          rm -f susfs_resukisu_oos_4.19.patch

          # 断言关键修复真的落到文件里, 防止补丁静默降级
          fail=0
          check() {
            if grep -q "$2" "$1"; then
              echo "[+] $1 : $2"
            else
              echo "[-] $1 : '$2' NOT FOUND"
              fail=1
            fi
          }
          check include/linux/susfs_def.h 'TIF_PROC_NO_SU 34'
          check include/linux/susfs_def.h 'susfs_is_current_proc_no_su'
          check include/linux/susfs_def.h 'TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT 35'
          check fs/stat.c 'ksu_handle_vfs_fstat'
          check fs/stat.c 'struct filename \*\*filename, int \*flags'
          check fs/open.c 'struct filename \*\*filename, int \*mode'
          check fs/namei.c '^int filename_lookup'
          check fs/exec.c 'susfs_is_current_proc_no_su'
          check include/linux/namei.h 'extern int filename_lookup'
          if [ "$fail" != "0" ]; then
            echo "[-] SUSFS/ReSukiSU patch did not apply as expected."
            false
          fi
          echo "[+] OOS SUSFS + ReSukiSU patched and verified."

      - name: 💿 Patch Kernel of Droidspaces (OOS)
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/
          cp /tmp/Patches/Droidspaces/oos_droidspaces.patch ./
          # 同 SUSFS: 不用 `|| true`, 否则补丁失败会以「DroidSpaces 已启用」的假象继续,
          # 但内核里其实没有对应改动, 运行期缺 /dev 或 cgroup 行为异常。
          patch -p1 --no-backup-if-mismatch < oos_droidspaces.patch
          if find . -name '*.rej' | grep -q .; then
            echo "[-] DroidSpaces patch left .rej files:"
            find . -name '*.rej'
            false
          fi
          rm -f oos_droidspaces.patch
          echo "[+] Patched DroidSpaces for OOS successfully."

      - name: 🔒 Patch Kernel of Baseband Guard (OOS, non-GKI)
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "[+] Patched Baseband Guard for OOS successfully."

      - name: 📝 Apply OOS defconfig fragment
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19/
          cp /tmp/Patches/Patch/defconfig_oos.patch ./
          # 这条补丁决定 CONFIG_KSU / CONFIG_KSU_SUSFS / CONFIG_BUILD_ARM64_DT_OVERLAY
          # 等关键开关, 静默失败会让整轮 root+SUSFS 工作白做, 必须硬失败。
          patch -p1 --no-backup-if-mismatch < defconfig_oos.patch
          if find . -name '*.rej' | grep -q .; then
            echo "[-] defconfig patch left .rej files:"
            find . -name '*.rej'
            false
          fi
          rm -f defconfig_oos.patch
          for opt in CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_BUILD_ARM64_DT_OVERLAY=y; do
            if grep -q "^$opt$" arch/arm64/configs/vendor/kona-perf_defconfig; then
              echo "[+] defconfig: $opt"
            else
              echo "[-] defconfig: $opt missing after patch."
              false
            fi
          done
          echo "[+] OOS defconfig applied."

      - name: "[1⁺] Apply OnePlus native features"
        run: |
          # oplus_native_features.mk is included by the top Makefile, but its plain
          # assignments are NOT exported to kbuild's per-directory sub-makes. On the
          # OnePlus Android build these are environment variables. Without them, the
          # OPLUS_FEATURE_* gates in mm/, drivers/scsi/ufs/ ... silently skip objects
          # (ufsfeature, ufs_signal_quality, ufs_latency_hist, task_mem, process_mm_reclaim).
          F="$GITHUB_WORKSPACE/kernel/msm-4.19/oplus_native_features.mk"
          if [ ! -f "$F" ]; then
            echo "[-] $F not found — check if OnePlus moved/renamed this file."
            false
          fi
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$' "$F" \
            | grep -vE '^(OPLUS_NATIVE_FEATURE_SET|OPLUS_NATIVE_MACRO_FEATURES)=' >> "$GITHUB_ENV"
          echo "[+] Exported $(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$' "$F") variables from oplus_native_features.mk."

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🖼️ Generate DTB (OOS concat kona dtb variants)
        run: |
          cd $GITHUB_WORKSPACE/kernel/msm-4.19
          DTB_DIR="out/arch/arm64/boot/dts/vendor/19821"
          if [ -f "$DTB_DIR/kona-mtp.dtb" ]; then
            cat "$DTB_DIR/kona-mtp.dtb" > out/arch/arm64/boot/dtb.img
            echo "[+] Generated dtb.img from kona-mtp.dtb"
          else
            # 回退: 拼接 vendor 下所有 dtb (与 OnePlus 官方 AndroidKernel.mk 一致)
            # 注意必须让 glob 显式失败时中止: 若该批 .dtb 全不存在, `cat` 会写一个
            # 0 字节的 dtb.img 并返回 0, 后续打包照常完成 -> 刷机后才发现在 boot 阶段炸。
            shopt -s nullglob
            dtbs=(out/arch/arm64/boot/dts/vendor/*/*.dtb)
            shopt -u nullglob
            if [ ${#dtbs[@]} -eq 0 ]; then
              echo "[-] No vendor .dtb files found; DTB generation would produce an empty image."
              false
            fi
            cat "${dtbs[@]}" > out/arch/arm64/boot/dtb.img
            echo "[+] Generated dtb.img (concat ${#dtbs[@]} vendor dtbs)"
          fi

          # dtb.img 走 concat 路径时应以 FDT magic d00dfeed 开头 (raw DTB 拼接);
          # dtbo.img 才是 Android dt_table, magic 是 d7b7ab1e。两者常被搞混。
          magic=$(od -An -tx1 -N4 out/arch/arm64/boot/dtb.img | tr -d ' ')
          size=$(stat -c %s out/arch/arm64/boot/dtb.img)
          echo "[+] dtb.img: ${size} bytes, magic=${magic}"
          if [ "$magic" != "d00dfeed" ]; then
            echo "[-] dtb.img magic is ${magic}, expected d00dfeed (raw FDT)."
            false
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
